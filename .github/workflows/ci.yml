name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test CLI
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/floq-config
          XDG_DATA_HOME: ${{ runner.temp }}/floq-data
        run: |
          node dist/index.js --version
          node dist/index.js add "ci smoke test"
          node dist/index.js list
